[package]
name = "gamma-launcher-rust"
version = "1.0.0"
edition = "2021"
authors = ["Gamma Launcher Rust Contributors"]
description = "Native Rust installer and manager for S.T.A.L.K.E.R. G.A.M.M.A. / Anomaly"
license = "GPL-3.0-only"
default-run = "gamma-launcher-rust"

[[bin]]
name = "gamma-launcher-rust"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "cookies", "gzip", "socks"] }
futures-util = "0.3"
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
indicatif = "0.17"
walkdir = "2"
zip = "1"
sevenz-rust2 = "0.20"
md-5 = "0.10"
hex = "0.4"
regex = "1"
dirs = "5"
rfd = "0.15"
chrono = { version = "0.4", features = ["clock"] }
tempfile = "3"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
